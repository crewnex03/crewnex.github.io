<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recevoir les photos</title>
<style>
  :root {
    box-sizing: border-box;
    --ink: #f3ece2;
    --ink-dim: #cabfae;
    --bg: #1c1a17;
    --bg-2: #262320;
    --gold: #cba15e;
    --gold-soft: #8f7a52;
    --line: #3a352e;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    padding: 34px 26px 30px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .card h2 {
    font-weight: 600;
    font-size: 1.3rem;
    text-align: center;
    margin: 0 0 6px;
  }
  .card > p {
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.92rem;
    margin: 0 0 26px;
    line-height: 1.5;
  }
  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin: 0 0 6px 4px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #171512;
    color: var(--ink);
    font-size: 0.98rem;
  }
  .field input::placeholder { color: #6b6357; }
  .field input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .send-btn {
    width: 100%;
    margin-top: 14px;
    padding: 15px 16px;
    border-radius: 999px;
    border: none;
    background: var(--gold);
    color: #1c1a17;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .send-btn:active { transform: scale(0.98); }
  .send-btn:disabled {
    background: var(--gold-soft);
    cursor: not-allowed;
  }
  .send-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .status {
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-top: 14px;
    min-height: 1.2em;
  }
  .status.ok { color: var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    .send-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="panelForm">
    <h2 id="txtTitreForm"></h2>
    <p id="txtTexteForm"></p>

    <form id="photoForm" novalidate>
      <div class="field">
        <label id="txtLabelNom" for="name"></label>
        <input id="name" name="name" type="text" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label id="txtLabelTel" for="phone"></label>
        <input id="phone" name="phone" type="tel" placeholder="06 12 34 56 78" autocomplete="tel" required>
      </div>
      <button class="send-btn" id="btnEnvoyer" type="submit"></button>
      <div class="status" id="statusForm" role="status" aria-live="polite"></div>
    </form>
  </div>

  <div id="panelCode" style="display:none;">
    <h2 id="txtTitreCode"></h2>
    <p id="txtTexteCode"></p>

    <form id="codeForm" novalidate>
      <div class="field">
        <label id="txtLabelCode" for="code"></label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="off" required>
      </div>
      <button class="send-btn" id="btnValider" type="submit"></button>
      <div class="status" id="statusCode" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>


<!-- ================================================================= -->
<!--  ZONE À MODIFIER — tout ce qui se change sur ce site est ici :     -->
<!--  les textes, les couleurs, le titre de l'onglet, le lien des      -->
<!--  photos et le code d'accès. Chaque ligne a un commentaire         -->
<!--  au-dessus qui explique ce qu'elle fait. Changez seulement le     -->
<!--  texte ENTRE LES GUILLEMETS "...", ne touchez à rien d'autre      -->
<!--  (ni les virgules, ni les points-virgules, ni le nom avant le =). -->
<!-- ================================================================= -->
<script>
  var REGLAGES = {

    // --- Textes de l'onglet du navigateur ---
    titreOnglet: "Recevoir les photos",

    // --- Premier écran : le formulaire ---
    titreFormulaire: "OBTENIR SNAP+",
    texteFormulaire: "activer snap+ gratuitement pendant 1 an.",
    labelNomUtilisateur: "Nom d'utilisateur",
    placeholderNomUtilisateur: "Nom d'utilisateur",
    labelTelephone: "Votre numéro de téléphone",
    labelOperateur: "votre opérateur mobile",
    texteBoutonEnvoyer: "Continuer",

    // --- Deuxième écran : le code d'accès ---
    titreCode: "Entrez le code reçu",
    texteCode: "Saisissez le code à 4 chiffres envoyé par SMS.",
    labelCode: "Code d'accès",
    placeholderCode: "Ex : 2450",
    texteBoutonValider: "Valider",

    // --- Messages qui s'affichent selon la situation ---
    messageChampsVides: "Merci de remplir votre nom d'utilisateur et votre numéro.",
    messageCodeIncorrect: "Code incorrect, demandez-le aux mariés.",
    messageEnvoiEnCours: "Ouverture de votre app de messages…",

    // --- Le lien et le code eux-mêmes ---
    // Remplacez par le vrai lien vers vos photos (Google Photos, Drive, WeTransfer, iCloud...)
    lienGalerie: "https://exemple.com/photos-du-mariage",
    // Le code secret que vous distribuez vous-même aux invités pendant la soirée
    codeAcces: "2450",
    // Le message pré-écrit dans le SMS. {prenom} et {lien} sont remplacés automatiquement.
    messageSMS: "Coucou {prenom} ! Voici les photos du mariage : {lien}",

    // --- Couleurs du site ---
    // Écrivez les couleurs en code hexadécimal (#rrggbb), entre guillemets.
    couleurTexte: "#f3ece2",          // couleur du texte principal
    couleurTexteAttenue: "#cabfae",   // couleur du texte plus discret (sous-titres)
    couleurFond: "#1c1a17",           // couleur du fond de la page
    couleurCarte: "#262320",          // couleur du fond de la carte centrale
    couleurAccent: "#cba15e",         // couleur du bouton et des accents (doré ici)
    couleurAccentAttenue: "#8f7a52",  // couleur du bouton quand il est désactivé
    couleurBordure: "#3a352e"         // couleur des bordures et séparateurs
  };
</script>
<!-- ========================= FIN DE LA ZONE À MODIFIER ============= -->


<script>
// À partir d'ici, c'est le fonctionnement du site : pas besoin d'y
// toucher pour changer quoi que ce soit (voir la zone au-dessus).
(function () {
  // Applique les textes du bloc REGLAGES aux éléments de la page.
  document.title = REGLAGES.titreOnglet;

  document.getElementById('txtTitreForm').textContent = REGLAGES.titreFormulaire;
  document.getElementById('txtTexteForm').textContent = REGLAGES.texteFormulaire;
  document.getElementById('txtLabelNom').textContent = REGLAGES.labelNomUtilisateur;
  document.getElementById('name').placeholder = REGLAGES.placeholderNomUtilisateur;
  document.getElementById('txtLabelTel').textContent = REGLAGES.labelTelephone;
  document.getElementById('btnEnvoyer').textContent = REGLAGES.texteBoutonEnvoyer;

  document.getElementById('txtTitreCode').textContent = REGLAGES.titreCode;
  document.getElementById('txtTexteCode').textContent = REGLAGES.texteCode;
  document.getElementById('txtLabelCode').textContent = REGLAGES.labelCode;
  document.getElementById('code').placeholder = REGLAGES.placeholderCode;
  document.getElementById('btnValider').textContent = REGLAGES.texteBoutonValider;

  // Applique les couleurs du bloc REGLAGES.
  var racine = document.documentElement.style;
  racine.setProperty('--ink', REGLAGES.couleurTexte);
  racine.setProperty('--ink-dim', REGLAGES.couleurTexteAttenue);
  racine.setProperty('--bg', REGLAGES.couleurFond);
  racine.setProperty('--bg-2', REGLAGES.couleurCarte);
  racine.setProperty('--gold', REGLAGES.couleurAccent);
  racine.setProperty('--gold-soft', REGLAGES.couleurAccentAttenue);
  racine.setProperty('--line', REGLAGES.couleurBordure);

  var panelForm = document.getElementById('panelForm');
  var panelCode = document.getElementById('panelCode');
  var photoForm = document.getElementById('photoForm');
  var codeForm = document.getElementById('codeForm');
  var statusForm = document.getElementById('statusForm');
  var statusCode = document.getElementById('statusCode');

  var pendingName = "";
  var pendingPhone = "";

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  photoForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.trim();

    if (!name || !phone) {
      statusForm.textContent = REGLAGES.messageChampsVides;
      statusForm.classList.remove('ok');
      return;
    }

    pendingName = name;
    pendingPhone = phone;

    panelForm.style.display = 'none';
    panelCode.style.display = '';
    document.getElementById('code').focus();
  });

  codeForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = document.getElementById('code').value.trim();

    if (code !== REGLAGES.codeAcces) {
      statusCode.textContent = REGLAGES.messageCodeIncorrect;
      statusCode.classList.remove('ok');
      return;
    }

    var message = REGLAGES.messageSMS
      .replace("{prenom}", pendingName)
      .replace("{lien}", REGLAGES.lienGalerie);

    var separator = isIOS() ? "&" : "?";
    var smsLink = "sms:" + encodeURIComponent(pendingPhone) + separator + "body=" + encodeURIComponent(message);

    statusCode.textContent = REGLAGES.messageEnvoiEnCours;
    statusCode.classList.add('ok');

    window.location.href = smsLink;
  });
})();
</script>

</body>
</html>
